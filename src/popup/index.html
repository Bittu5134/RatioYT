<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RatioYT</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="popup">

    <header class="header">
      <img class="logo" src="../images/logo.png" height="34" alt="RatioYT">
      <div>
        <h1>RatioYT</h1>
        <p class="subtitle">like/dislike scores for YouTube</p>
      </div>
    </header>

    <main class="content">

      <section class="section">
        <p class="section-label">Display</p>

        <div class="row">
          <p class="label">Score format</p>
          <div class="select-wrap">
            <select id="scoringSystem">
              <option value="percentage">Percentage</option>
              <option value="decimal">10-point ratio</option>
              <option value="smiley">Smiley faces</option>
              <option value="stars">Star rating</option>
            </select>
            <svg viewBox="0 0 12 12" width="11" height="11" class="chevron" aria-hidden="true">
              <path d="M2 4.5 6 8.5l4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="row">
          <div>
            <p class="label">Colour scores</p>
            <p class="hint">Red to green by rating</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="scoringColour" checked>
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>

        <div class="row">
          <div>
            <p class="label">Filter Only Mode</p>
            <p class="hint">Hide badges, filter silently</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="hideOnlyMode">
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>
      </section>

      <section class="section">
        <p class="section-label">Filtering</p>

        <div class="row">
          <div>
            <p class="label">Hide low-rated videos</p>
            <p class="hint">Blurred until turned off</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="hideLowScore">
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>

        <div id="filterOptions" class="nested hidden">
          <div class="threshold-row">
            <p class="label">Minimum score</p>
            <span id="thresholdValue" class="pill">25%</span>
          </div>
          <input type="range" id="lowScoreThreshold" min="0" max="100" value="25" step="1">
          <div class="ticks">
            <span>0%</span><span>50%</span><span>100%</span>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <div class="links">
        <a href="https://ratioyt.bittu.dev" target="_blank" rel="noopener">Website</a>
        <a href="https://bittu.dev/discord" target="_blank" rel="noopener">Discord</a>
        <a href="https://www.patreon.com/cw/LazyBittu" target="_blank" rel="noopener" class="donate">Donate ♡</a>
      </div>
    </footer>

  </div>
  <script src="./main.js"></script>
</body>
</html>
