<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RatioYT</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="popup">

    <header class="header">
      <svg class="logo" viewBox="0 0 128 128" width="32" height="32" aria-hidden="true">
        <rect x="4" y="4" width="120" height="120" rx="32" fill="#f5c2e7"/>
        <g transform="rotate(-8 64 66)">
          <path fill="#fde8d7" d="M38 96h30.2c3.3 0 6.2-2 7.3-5l11.9-27.6c.5-1.1.7-2.3.7-3.5v-7.5c0-4.4-3.6-8-8-8H65.9l3.8-18.3.1-1.3c0-1.6-.7-3.1-1.7-4.2L64 15 37.6 41.4c-1.5 1.5-2.4 3.5-2.4 5.7v41c0 4.3 3.5 7.9 7.9 7.9z"/>
          <rect x="17" y="46" width="18" height="50" rx="6" fill="#fde8d7"/>
        </g>
      </svg>
      <div>
        <h1>RatioYT</h1>
        <p class="subtitle">like/dislike scores for YouTube</p>
      </div>
    </header>

    <div class="divider"></div>

    <main class="content">

      <section class="section">
        <p class="section-label">Display</p>
        <div class="row">
          <label for="scoringSystem" class="label">Score format</label>
          <div class="select-wrap">
            <select id="scoringSystem">
              <option value="percentage">Percentage</option>
              <option value="decimal">10-point ratio</option>
              <option value="smiley">Smiley faces</option>
              <option value="stars">Star rating</option>
            </select>
            <svg viewBox="0 0 12 12" width="11" height="11" class="chevron" aria-hidden="true">
              <path d="M2 4.5 6 8.5l4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="row">
          <div>
            <p class="label">Colour scores</p>
            <p class="hint">Red to green by rating</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="scoringColour" checked>
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>

        <div class="row">
          <div>
            <p class="label">Quiet mode</p>
            <p class="hint">Hide badges, filter silently</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="hideOnlyMode">
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>
      </section>

      <div class="divider"></div>

      <section class="section">
        <p class="section-label">Filtering</p>

        <div class="row">
          <div>
            <p class="label">Hide low-rated videos</p>
            <p class="hint">Home and search</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="hideLowScore">
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>

        <div id="filterOptions" class="nested hidden">
          <div class="threshold-row">
            <p class="label">Minimum score</p>
            <span id="thresholdValue" class="pill">25%</span>
          </div>
          <input type="range" id="lowScoreThreshold" min="0" max="100" value="25" step="1">
          <div class="ticks">
            <span>0%</span><span>50%</span><span>100%</span>
          </div>
        </div>
      </section>

    </main>

    <div class="divider"></div>

    <footer class="footer">
      <div class="links">
        <a href="https://thumbscore.bittu.dev" target="_blank" rel="noopener">Website</a>
        <a href="https://discord.gg/CZdNvKaNNr" target="_blank" rel="noopener">Discord</a>
        <a href="https://www.patreon.com/cw/LazyBittu" target="_blank" rel="noopener" class="donate">Donate ♡</a>
      </div>
    </footer>

  </div>
  <script src="./main.js"></script>
</body>
</html>
